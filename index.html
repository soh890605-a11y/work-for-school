<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>나의 교행노트</title>

  <style>
    body {
      margin: 0;
      font-family: sans-serif;
      background: #f4f4f4;
    }

    header {
      background: #2563eb;
      color: white;
      padding: 20px;
      text-align: center;
      font-size: 28px;
      font-weight: bold;
    }

    .container {
      padding: 30px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
    }

    .card {
      background: white;
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      transition: 0.2s;
      cursor: pointer;
    }

    .card:hover {
      transform: translateY(-5px);
    }

    .card h2 {
      margin-top: 0;
      color: #2563eb;
    }

    .card p {
      color: #555;
    }
  </style>
</head>

<body>

<header>
  📚 나의 교행노트
</header>

<div class="container">

  <div class="card">
    <h2>💰 금액 한글 변환</h2>
    <p>숫자를 한글 금액으로 변환합니다.</p>
  </div>

  <div class="card">
    <h2>📅 날짜 계산기</h2>
    <p>날짜 차이를 계산합니다.</p>
  </div>

  <div class="card">
    <h2>📝 메모장</h2>
    <p>간단한 메모를 저장합니다.</p>
  </div>

  <div class="card">
    <h2>📄 PDF 도구</h2>
    <p>PDF 관련 기능 모음입니다.</p>
  </div>

</div>

</body>
</html>
