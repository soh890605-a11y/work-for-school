<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>솧의 교행노트</title>

<style>
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #f7f6f3;
    color: #37352f;
  }

  header {
    background: #ffffff;
    color: #37352f;
    padding: 32px 24px 12px;
    font-size: 34px;
    font-weight: 700;
    border-bottom: 1px solid #e9e5dc;
  }

  header::after {
    content: "업무에 필요한 도구를 한 곳에 모아두는 개인 업무노트";
    display: block;
    margin-top: 10px;
    font-size: 15px;
    font-weight: 400;
    color: #787774;
  }

  .container {
    max-width: 980px;
    margin: 0 auto;
    padding: 36px 24px;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    gap: 14px;
  }

  .card {
    background: #ffffff;
    border: 1px solid #e9e5dc;
    border-radius: 10px;
    padding: 22px;
    box-shadow: none;
    transition: 0.15s ease;
    cursor: pointer;
  }

  .card:hover {
    background: #f1f1ef;
    transform: none;
  }

  .card h2 {
    margin: 0 0 10px;
    color: #37352f;
    font-size: 19px;
    font-weight: 600;
  }

  .card p {
    margin: 0;
    color: #787774;
    font-size: 14px;
    line-height: 1.6;
  }
</style>
</head>

<body>

<header>
  📚 솧의 교행노트
</header>

<div class="container">

  <div class="card">
    <h2>💰 이런저런업무</h2>
    <p>2026.7.1.업무인수인계관련페이지</p>
  </div>

  <div class="card">
    <h2>📅 날짜 계산기</h2>
    <p>날짜 차이를 계산합니다.</p>
  </div>

  <div class="card">
    <h2>📝 메모장</h2>
    <p>간단한 메모를 저장합니다.</p>
  </div>

  <div class="card">
    <h2>📄 PDF 도구</h2>
    <p>PDF 관련 기능 모음입니다.</p>
  </div>

</div>

</body>
</html>
